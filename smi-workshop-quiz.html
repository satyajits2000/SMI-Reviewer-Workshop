<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTRA — SMI Reviewer Workshop</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --red:#d22328; --red-dk:#a51a1e; --red-lt:#fdecea;
  --teal:#003e4a; --teal2:#005a6e; --teal-lt:#2eb2b2; --teal-pale:#e0f4f4;
  --gold:#c8a96e; --orange:#ef8029; --orange-bg:#fff3e0;
  --green:#2e7d32; --green-bg:#e8f5e9;
  --bg:#f0f4f6; --surface:#ffffff; --border:#dde4e8; --text:#1a2430; --muted:#5c6b75;
  --fh:'Raleway',sans-serif; --fb:'Source Sans 3',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fb);background:var(--bg);color:var(--text);}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:14px 20px;}
header .brandrow{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:10px;}
header .brandrow img{max-height:30px;width:auto;display:block;}
header .dci-tag{background:rgba(255,255,255,0.92);border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center;}
header .dci-tag img{max-height:22px;width:auto;display:block;}
header .logo{font-family:var(--fh);font-weight:900;font-size:1.4em;letter-spacing:2px;}
header .logo span{color:#ff8a80;}
header p{font-size:0.85em;opacity:.85;margin-top:6px;}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card h2{font-family:var(--fh);font-size:1.05em;color:var(--teal);margin-bottom:4px;}
.card .sub{font-size:0.85em;color:var(--muted);margin-bottom:14px;}
.typepill{display:inline-block;font-size:10px;font-weight:700;color:var(--teal2);background:var(--teal-pale);padding:3px 9px;border-radius:10px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--fb);font-size:0.95em;margin-bottom:12px;background:var(--bg);}
label.fl{font-size:0.78em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;}
.btn{padding:11px 20px;border-radius:6px;border:none;font-family:var(--fb);font-weight:700;font-size:0.9em;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;}
.btn-red{background:var(--red);color:#fff;} .btn-red:hover{background:var(--red-dk);}
.btn-teal{background:var(--teal);color:#fff;}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.question{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.question:last-child{border-bottom:none;}
.qtext{font-weight:700;margin-bottom:10px;}
.option{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1.5px solid var(--border);border-radius:6px;margin-bottom:7px;cursor:pointer;font-size:0.92em;}
.option:hover{background:#fafcfd;}
.option.selected{border-color:var(--teal);background:var(--teal-pale);}
.option input{margin:0;}
.matchrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.matchrow .term{min-width:170px;font-weight:700;font-size:0.85em;background:var(--bg);border:1px solid var(--border);padding:9px 10px;border-radius:6px;}
.matchrow select{flex:1;min-width:200px;margin-bottom:0;}
.qsaved{display:none;font-size:0.75em;font-weight:700;color:var(--green);margin-left:8px;}
.qsaved.show{display:inline;}
.matrix-wrap{overflow-x:auto;margin-bottom:4px;}
.matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:0.85em;}
.matrix th{background:var(--bg);color:var(--muted);font-size:0.72em;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:10px 8px;border-bottom:2px solid var(--border);text-align:center;}
.matrix th:first-child{text-align:left;}
.matrix td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:center;}
.matrix td:first-child{text-align:left;font-weight:700;background:var(--bg);}
.matrix tr:last-child td{border-bottom:none;}
.matrix input[type=checkbox]{width:18px;height:18px;cursor:pointer;}
.match-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.match-slot{border:1.5px dashed var(--border);border-radius:8px;padding:10px 12px;background:var(--bg);cursor:pointer;transition:all .15s;}
.match-slot.active{border-color:var(--red);background:var(--red-lt);}
.match-slot.filled{border-style:solid;border-color:var(--green);background:var(--green-bg);cursor:pointer;}
.match-slot-term{font-weight:800;font-size:0.85em;color:var(--teal);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.match-slot-fill{font-size:0.88em;line-height:1.4;color:var(--muted);}
.match-slot.filled .match-slot-fill{color:var(--text);}
.match-pool{display:flex;flex-direction:column;gap:8px;}
.match-card{border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:0.88em;line-height:1.4;cursor:pointer;background:var(--surface);transition:all .15s;}
.match-card:hover{border-color:var(--teal-lt);}
.match-card.selected{border-color:var(--red);background:var(--red-lt);}
.match-card.used{display:none;}
.match-hint{font-size:0.78em;color:var(--muted);margin-bottom:10px;}
.match-defs{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.match-def{display:flex;gap:10px;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:0.88em;line-height:1.45;}
.match-def .letter{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:0.8em;display:flex;align-items:center;justify-content:center;}
.match-term-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.match-term-row .term-name{font-weight:800;font-size:0.85em;color:var(--teal);min-width:150px;}
.match-chip{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-weight:800;font-size:0.9em;cursor:pointer;color:var(--text);}
.match-chip.selected{background:var(--red);border-color:var(--red);color:#fff;}
.match-chip.taken-elsewhere{opacity:.4;}
.progressbar{height:5px;background:var(--border);border-radius:3px;margin-bottom:18px;overflow:hidden;}
.progressbar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--teal-lt));transition:width .4s;}
.section-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.section-nav .snbtn{flex:1;min-width:90px;padding:10px 8px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);text-align:center;font-size:0.78em;font-weight:700;cursor:pointer;}
.section-nav .snbtn.done{border-color:var(--green);color:var(--green);background:var(--green-bg);}
.section-nav .snbtn.cur{border-color:var(--teal);background:var(--teal);color:#fff;}
.result-banner{text-align:center;padding:30px 20px;}
.result-banner .score{font-family:var(--fh);font-size:2.6em;font-weight:900;color:var(--teal);}
.msg{font-size:0.85em;color:var(--muted);}
.qr-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;display:inline-block;}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <img src="SYSTRA_logo.png" alt="SYSTRA" onerror="this.style.display='none'">
    <div class="dci-tag"><img src="DCI_logo.png" alt="DCI" onerror="this.parentElement.style.display='none'"></div>
  </div>
  <p>SMI Reviewer Workshop · Internal Control &amp; Quality</p>
</header>
<main id="app"></main>

<!-- Firebase -->
<script type="module">

import { getDatabase, ref, set, push, onValue, get, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQaDGAOslmVabYfMp7erAVDCzCXhAUj7c",
  authDomain: "quality-quiz-5d8fa.firebaseapp.com",
  databaseURL: "https://quality-quiz-5d8fa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "quality-quiz-5d8fa",
  storageBucket: "quality-quiz-5d8fa.firebasestorage.app",
  messagingSenderId: "200263271557",
  appId: "1:200263271557:web:24908b21ce8d7bb1a795ec"

let db = null;
try{
  const app = initializeApp(firebaseConfig, 'smi-workshop-quiz');
  db = getDatabase(app);
}catch(e){ console.warn('Firebase init failed', e.message); }
window._fb = { db, ref, set, push, onValue, get, update };
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
/* ===================== QUIZ CONTENT ===================== */
const DEFAULT_SECTIONS = {
  1: { title: "Quality Engagement Formalisation", questions: [
      { type:"mcq_single", text:"How is SYSTRA's quality engagement formalized?",
        options:[
          "Through voluntary initiatives with no set framework",
          "Through a formalized Integrated Management System (IMS), based on a process framework, defined requirements, and regular review cycle",
          "Only through external audits"
        ], correct:1 },
      { type:"match_dropdown", text:"Self-assessment vs entity review?",
        pairs:[
          {term:"Entity Review", definition:"A test of basic controls within the entity's organization."},
          {term:"Self-assessment", definition:"A formal process used within SYSTRA to evaluate and document each entity's compliance with the requirements of the SYSTRA Red Book, which sets out the key rules and processes for the entire Group."}
        ]},
      { type:"mcq_multi", text:"Why can SYSTRA rely on the General Policy rather than a separate quality policy? (Choose all that apply)",
        options:[
          "The General Policy is appropriate to SYSTRA's purpose and context and supports its strategic direction.",
          "The General Policy, through the Integrated Management System, provides a framework for setting quality objectives.",
          "The General Policy includes a commitment to satisfy applicable requirements.",
          "The General Policy includes a commitment to continual improvement.",
          "Quality is not considered a priority at SYSTRA."
        ], correct:[0,1,2,3] }
  ]},
  2: { title: "Processes & Procedures", questions: [
      { type:"match_multi", text:"Within which process is each of the following associated? (some items may apply to more than one process)",
        allOptions:["Strategy & Performance","Project delivery","Working Environment Management"],
        items:[
          {item:"ETHICS", correct:["Strategy & Performance","Project delivery"]},
          {item:"3S", correct:["Working Environment Management"]},
          {item:"SUSTAINABILITY", correct:["Project delivery"]},
          {item:"M&A", correct:["Strategy & Performance"]}
        ]},
      { type:"match_dropdown", text:"Red procedure vs Group procedure vs Local procedure?",
        pairs:[
          {term:"Red Procedure", definition:"A Group mandatory procedure linked to a Red Book requirement. It must be applied as issued unless the document explicitly allows flexibility or local adaptation."},
          {term:"Group Procedure", definition:"A Group-level procedure describing how to implement business process requirements across the organization. Some Group Procedures are Red Procedures, but not all."},
          {term:"Local Procedure", definition:"A local procedure describing how Group requirements are implemented in a local entity or country context, while remaining aligned with mandatory Group requirements."}
        ]}
  ]},
  3: { title: "Role of the IMS Representative", questions: [
      { type:"mcq_single", text:"After a Group process review, what is the primary role of the IMS representative locally?",
        options:[
          "To disregard findings until the next review cycle",
          "To ensure that findings and resulting action plans are followed up, implemented, and communicated within the entity",
          "To replace the Group Process Pilot in conducting the review",
          "To archive the review without coordinating local follow-up"
        ], correct:1 },
      { type:"match_dropdown", text:"Internal Control vs Internal Audit?",
        pairs:[
          {term:"Internal Control", definition:"Designs reasonable measures to protect the Company from risks."},
          {term:"Internal Audit", definition:"Ensures that the System of Internal Control is rightly set and verifies regularly internal and external compliance."}
        ]}
  ]}
};
let SECTIONS = DEFAULT_SECTIONS; // may be overridden by an admin-published question bank
let TOTAL_QUESTIONS = Object.values(SECTIONS).reduce((s,sec)=>s+sec.questions.length,0); // 7
const TYPE_LABEL = { mcq_single:"Multiple Choice — Single Answer", mcq_multi:"Multiple Choice — Multiple Answers",
  match_dropdown:"Match the Following", match_multi:"Match the Following (multi)" };

/* ===================== STATE ===================== */
const params = new URLSearchParams(location.search);
let state = {
  phase: 'loading',       // loading | noSession | identify | quiz | done
  sessionId: null,
  session: null,
  startSection: params.get('section') ? Number(params.get('section')) : 1,
  curSection: params.get('section') ? Number(params.get('section')) : 1,
  name: '', entity: '',
  participantKey: null,
  answers: {},
  sectionResults: {}   // {1:{points,total}, 2:{...}, 3:{...}} accumulated across submits this browser session
};

const appEl = document.getElementById('app');
function render(){
  if(state.phase==='loading') return renderLoading();
  if(state.phase==='noSession') return renderNoSession();
  if(state.phase==='identify') return renderIdentify();
  if(state.phase==='quiz') return renderQuiz();
  if(state.phase==='done') return renderDone();
}
function renderLoading(){ appEl.innerHTML = `<div class="card"><div class="msg">Loading session…</div></div>`; }
function renderNoSession(){
  appEl.innerHTML = `<div class="card">
    <h2>No active session</h2>
    <div class="sub">Ask the facilitator to start a session from the Dashboard, then tap Retry.</div>
    <button class="btn btn-teal" id="retryBtn">Retry</button>
  </div>`;
  document.getElementById('retryBtn').onclick = init;
}

/* ---------- IDENTIFY ---------- */
let ENTITY_OPTIONS = [];

function renderIdentify(){
  const savedName = localStorage.getItem('smi_name') || '';
  const savedEntity = localStorage.getItem('smi_entity') || '';
  const entityOptionsHtml = ENTITY_OPTIONS.length
    ? `<option value="" disabled ${savedEntity?'':'selected'}>— Select your entity/team —</option>` +
      ENTITY_OPTIONS.map(e=>`<option value="${e}" ${e===savedEntity?'selected':''}>${e}</option>`).join('')
    : `<option value="">(no entity list set up yet — leave blank or ask facilitator)</option>`;

  appEl.innerHTML = `
    <div class="card">
      <h2>${state.session?.name || 'SMI Reviewer Workshop'}</h2>
      <div class="sub">${state.session?.location ? state.session.location+' · ' : ''}Enter your details to begin Section ${state.curSection}.</div>
      ${savedName ? `<div class="msg" style="margin-bottom:10px">Welcome back — continuing as <b>${savedName}</b>. <a href="#" id="notYouLink" style="color:var(--red)">Not you?</a></div>` : ''}
      <label class="fl">Your name</label>
      <input type="text" id="pName" value="${savedName}" placeholder="e.g. Satyajit Roy">
      <label class="fl">Entity / Team</label>
      <select id="pEntity">${entityOptionsHtml}</select>
      <button class="btn btn-red" id="startBtn">Start Section ${state.curSection}</button>
    </div>`;

  const notYou = document.getElementById('notYouLink');
  if(notYou) notYou.onclick = (e)=>{ e.preventDefault(); document.getElementById('pName').value=''; localStorage.removeItem('smi_name'); localStorage.removeItem('smi_entity'); };

  document.getElementById('startBtn').onclick = ()=>{
    const name = document.getElementById('pName').value.trim();
    const entity = document.getElementById('pEntity').value.trim();
    if(!name){ alert('Please enter your name'); return; }
    localStorage.setItem('smi_name', name);
    localStorage.setItem('smi_entity', entity);
    state.name = name; state.entity = entity;
    state.participantKey = (name + '_' + entity).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    loadExistingParticipant().then(()=>{ state.phase='quiz'; render(); });
  };
}

async function loadEntityOptions(){
  if(!window._fb?.db) return;
  try{
    const snap = await window._fb.get(window._fb.ref(window._fb.db, 'smi_workshop_entities'));
    if(snap.exists()){
      const v = snap.val();
      ENTITY_OPTIONS = Array.isArray(v) ? v.filter(Boolean) : Object.values(v).filter(Boolean);
    }
  }catch(e){ console.warn('entity list load failed', e.message); }
}

async function loadExistingParticipant(){
  if(!window._fb?.db || !state.sessionId) return;
  try{
    const snap = await window._fb.get(window._fb.ref(window._fb.db, `smi_workshop_sessions/${state.sessionId}/participants/${state.participantKey}`));
    if(snap.exists()){
      const p = snap.val();
      state.sectionResults = p.sectionResultsBySection || {};
    }
  }catch(e){ console.warn(e); }
}

/* ---------- QUIZ ---------- */
function shuffleWithIndex(arr){
  const idx = arr.map((v,i)=>({text:v,i}));
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx;
}
function renderQuestionBlock(q,i){
  const typePill = `<div class="typepill">${TYPE_LABEL[q.type]}</div>`;
  const header = `<p class="qtext">${i+1}. ${q.text}</p>`;
  const saveFooter = `<div style="margin-top:10px;display:flex;align-items:center;gap:10px">
    <button type="button" class="btn btn-teal btn-sm" id="saveBtn-${i}" disabled>💾 Save answer</button>
    <span class="qsaved" id="qsaved-${i}">✓ Saved</span>
  </div>`;
  if(q.type==='mcq_single'){
    const opts = q.options.map((o,oi)=>`<div class="option" data-oi="${oi}">${o}</div>`).join('');
    return `<div class="question" data-qi="${i}" data-type="mcq_single">${typePill}${header}${opts}${saveFooter}</div>`;
  }
  if(q.type==='mcq_multi'){
    const opts = q.options.map((o,oi)=>`<label class="option" data-oi="${oi}"><input type="checkbox" data-oi="${oi}"> ${o}</label>`).join('');
    return `<div class="question" data-qi="${i}" data-type="mcq_multi">${typePill}${header}${opts}${saveFooter}</div>`;
  }
  if(q.type==='match_dropdown'){
    const letters = ['A','B','C','D','E'];
    const shuffled = shuffleWithIndex(q.pairs.map(p=>p.definition)); // {text, i: original term index}
    const defs = shuffled.map((s,li)=>`<div class="match-def"><div class="letter">${letters[li]}</div><div>${s.text}</div></div>`).join('');
    const terms = q.pairs.map((p,ti)=>{
      const chips = shuffled.map((s,li)=>`<button type="button" class="match-chip" data-ti="${ti}" data-li="${li}" data-defi="${s.i}">${letters[li]}</button>`).join('');
      return `<div class="match-term-row" data-ti="${ti}"><div class="term-name">${p.term}</div>${chips}</div>`;
    }).join('');
    return `<div class="question" data-qi="${i}" data-type="match_dropdown">${typePill}${header}
      <div class="match-hint">Read the lettered definitions below, then tap the matching letter next to each term.</div>
      <div class="match-defs">${defs}</div>
      ${terms}
      ${saveFooter}
    </div>`;
  }
  if(q.type==='match_multi'){
    const headerCells = q.allOptions.map(opt=>`<th>${opt}</th>`).join('');
    const rows = q.items.map((it,ii)=>{
      const cells = q.allOptions.map((opt,oi)=>`<td><input type="checkbox" data-ii="${ii}" data-oi="${oi}"></td>`).join('');
      return `<tr data-ii="${ii}"><td>${it.item}</td>${cells}</tr>`;
    }).join('');
    return `<div class="question" data-qi="${i}" data-type="match_multi">${typePill}${header}
      <div class="matrix-wrap"><table class="matrix"><thead><tr><th>Item</th>${headerCells}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="msg" style="margin-top:6px">Tick every process that applies to each item — some items may have more than one.</div>
      ${saveFooter}</div>`;
  }
  return '';
}

function renderQuiz(){
  const sec = SECTIONS[state.curSection];
  state.answers = {};
  const navBtns = Object.keys(SECTIONS).map(id=>{
    const done = state.sectionResults[id] != null;
    const cur = Number(id)===state.curSection;
    return `<div class="snbtn ${done?'done':''} ${cur?'cur':''}" data-sec="${id}">Sec ${id}${done?' ✓':''}</div>`;
  }).join('');
  const pct = Math.round((Object.keys(state.sectionResults).length/3)*100);

  appEl.innerHTML = `
    <div class="card">
      <div class="section-nav">${navBtns}</div>
      <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
      <h2>Section ${state.curSection} — ${sec.title}</h2>
      <div class="sub">${state.name}${state.entity?' · '+state.entity:''}</div>
      ${sec.questions.map((q,i)=>renderQuestionBlock(q,i)).join('')}
      <button class="btn btn-red" id="submitBtn" disabled>Submit Section ${state.curSection}</button>
      <span class="msg" id="submitMsg" style="margin-left:10px"></span>
    </div>`;

  appEl.querySelectorAll('.snbtn').forEach(b=>{
    b.onclick = ()=>{ state.curSection = Number(b.dataset.sec); renderQuiz(); };
  });

  wireInteractions(sec);
}

function wireInteractions(sec){
  function checkComplete(){
    const complete = sec.questions.every((q,i)=>{
      const a = state.answers[i];
      if(a===undefined) return false;
      if(q.type==='mcq_single') return typeof a==='number';
      if(q.type==='mcq_multi') return Array.isArray(a) && a.length>0;
      if(q.type==='match_dropdown') return Object.keys(a).length===q.pairs.length;
      if(q.type==='match_multi') return Object.keys(a).length===q.items.length && Object.values(a).every(v=>v.length>0);
      return false;
    });
    document.getElementById('submitBtn').disabled = !complete;
  }

  function isQuestionAnswered(q,i){
    const a = state.answers[i];
    if(a===undefined) return false;
    if(q.type==='mcq_single') return typeof a==='number';
    if(q.type==='mcq_multi') return Array.isArray(a) && a.length>0;
    if(q.type==='match_dropdown') return Object.keys(a).length===q.pairs.length;
    if(q.type==='match_multi') return Object.keys(a).length===q.items.length && Object.values(a).every(v=>v.length>0);
    return false;
  }

  // Answering a question only enables its "Save answer" button — nothing is
  // written to Firebase until the person explicitly taps Save. That gives a
  // clear, deliberate confirmation instead of a background auto-save.
  function updateSaveButton(i){
    const q = sec.questions[i];
    const btn = document.getElementById(`saveBtn-${i}`);
    const tag = document.getElementById(`qsaved-${i}`);
    if(btn) btn.disabled = !isQuestionAnswered(q,i);
    if(tag) tag.classList.remove('show'); // answer changed since it was last saved
  }

  async function saveQuestionAnswer(i){
    const btn = document.getElementById(`saveBtn-${i}`);
    const tag = document.getElementById(`qsaved-${i}`);
    if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
    if(window._fb?.db && state.sessionId && state.participantKey){
      try{
        await window._fb.set(
          window._fb.ref(window._fb.db, `smi_workshop_sessions/${state.sessionId}/participants/${state.participantKey}/_liveAnswers/section${state.curSection}/q${i}`),
          { answer: state.answers[i], savedAt: new Date().toISOString() }
        );
      }catch(e){ console.warn('per-question save failed', e.message); }
    }
    if(btn){ btn.textContent = '💾 Save answer'; btn.disabled = false; }
    if(tag) tag.classList.add('show');
  }

  appEl.querySelectorAll('.question').forEach(qEl=>{
    const qi = Number(qEl.dataset.qi);
    const q = sec.questions[qi];
    const type = qEl.dataset.type;
    const saveBtnEl = document.getElementById(`saveBtn-${qi}`);
    if(saveBtnEl) saveBtnEl.onclick = ()=> saveQuestionAnswer(qi);
    if(type==='mcq_single'){
      qEl.querySelectorAll('.option').forEach(o=>{
        o.onclick = ()=>{
          qEl.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
          o.classList.add('selected');
          state.answers[qi] = Number(o.dataset.oi);
          checkComplete(); updateSaveButton(qi);
        };
      });
    }
    if(type==='mcq_multi'){
      qEl.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.onchange = ()=>{
          const sel = Array.from(qEl.querySelectorAll('input[type=checkbox]:checked')).map(c=>Number(c.dataset.oi));
          state.answers[qi] = sel;
          cb.closest('.option').classList.toggle('selected', cb.checked);
          checkComplete(); updateSaveButton(qi);
        };
      });
    }
    if(type==='match_dropdown'){
      const chips = qEl.querySelectorAll('.match-chip');
      function refreshChips(){
        const used = state.answers[qi] || {}; // {ti: defi}
        const usedDefIndices = new Set(Object.values(used));
        chips.forEach(c=>{
          const ti = c.dataset.ti, defi = Number(c.dataset.defi);
          c.classList.toggle('selected', used[ti] === defi);
          c.classList.toggle('taken-elsewhere', usedDefIndices.has(defi) && used[ti] !== defi);
        });
      }
      chips.forEach(chip=>{
        chip.onclick = ()=>{
          const ti = chip.dataset.ti, defi = Number(chip.dataset.defi);
          state.answers[qi] = state.answers[qi] || {};
          if(state.answers[qi][ti] === defi){
            delete state.answers[qi][ti]; // tap again to unselect
          } else {
            // clear this definition from whichever other term had it (1-1 pairing)
            Object.keys(state.answers[qi]).forEach(k=>{ if(state.answers[qi][k]===defi) delete state.answers[qi][k]; });
            state.answers[qi][ti] = defi;
          }
          refreshChips();
          checkComplete(); updateSaveButton(qi);
        };
      });
    }
    if(type==='match_multi'){
      qEl.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.onchange = ()=>{
          state.answers[qi] = state.answers[qi] || {};
          const ii = cb.dataset.ii;
          const checked = Array.from(qEl.querySelectorAll(`input[data-ii="${ii}"]:checked`)).map(c=>Number(c.dataset.oi));
          state.answers[qi][ii] = checked;
          checkComplete(); updateSaveButton(qi);
        };
      });
    }
  });

  document.getElementById('submitBtn').onclick = async ()=>{
    let correct = 0;
    sec.questions.forEach((q,i)=>{
      const a = state.answers[i];
      let ok=false;
      if(q.type==='mcq_single') ok = a===q.correct;
      else if(q.type==='mcq_multi') ok = [...a].sort().join(',')===[...q.correct].sort().join(',');
      else if(q.type==='match_dropdown') ok = q.pairs.every((p,ti)=>a[ti]===ti);
      else if(q.type==='match_multi') ok = q.items.every((it,ii)=>{
        const selNames = (a[ii]||[]).map(oi=>q.allOptions[oi]).sort().join(',');
        return selNames === [...it.correct].sort().join(',');
      });
      if(ok) correct++;
    });

    state.sectionResults[state.curSection] = { points: correct, total: sec.questions.length, type: correct===sec.questions.length?'correct':(correct>0?'partial':'poor') };
    document.getElementById('submitMsg').textContent = 'Saving…';
    await saveParticipant();

    const remaining = Object.keys(SECTIONS).map(Number).filter(id=> state.sectionResults[id]==null);
    if(remaining.length){
      state.curSection = remaining[0];
      renderQuiz();
    } else {
      state.phase = 'done';
      render();
    }
  };
}

async function saveParticipant(){
  if(!window._fb?.db || !state.sessionId) return;
  const sectionsCompleted = Object.keys(state.sectionResults).length;
  const totalPoints = Object.values(state.sectionResults).reduce((s,r)=>s+r.points,0);
  const totalPossible = Object.values(state.sectionResults).reduce((s,r)=>s+r.total,0);
  const sceneResults = [1,2,3].map(id => state.sectionResults[id] || null); // array form, aligned with CV Fraud dashboard's pd-scenes rendering
  const record = {
    name: state.name,
    entity: state.entity,
    status: sectionsCompleted>=3 ? 'completed' : 'in_progress',
    startTime: state._startTime || (state._startTime = new Date().toISOString()),
    endTime: sectionsCompleted>=3 ? new Date().toISOString() : null,
    sectionsCompleted,
    finalScore: totalPoints,
    scoreMax: TOTAL_QUESTIONS,
    nCorrect: Object.values(state.sectionResults).filter(r=>r.points===r.total).length,
    nPartial: Object.values(state.sectionResults).filter(r=>r.points>0 && r.points<r.total).length,
    nPoor: Object.values(state.sectionResults).filter(r=>r.points===0).length,
    sceneResults,
    sectionResultsBySection: state.sectionResults
  };
  try{
    await window._fb.set(window._fb.ref(window._fb.db, `smi_workshop_sessions/${state.sessionId}/participants/${state.participantKey}`), record);
  }catch(e){ console.error('save failed', e); }
}

/* ---------- DONE ---------- */
function renderDone(){
  const total = Object.values(state.sectionResults).reduce((s,r)=>s+r.points,0);
  appEl.innerHTML = `
    <div class="card result-banner">
      <div class="typepill">All sections complete</div>
      <div class="score">${total}/${TOTAL_QUESTIONS}</div>
      <div class="msg">Thanks, ${state.name}. Your responses have been recorded.</div>
    </div>`;
}

/* ---------- INIT: load question bank, then find active session ---------- */
async function loadQuestionBank(){
  if(!window._fb?.db) return;
  try{
    const snap = await window._fb.get(window._fb.ref(window._fb.db, 'smi_workshop_questions'));
    if(snap.exists()){
      const q = snap.val();
      if(q['1']?.questions?.length && q['2']?.questions?.length && q['3']?.questions?.length){
        SECTIONS = q;
        TOTAL_QUESTIONS = Object.values(SECTIONS).reduce((s,sec)=>s+sec.questions.length,0);
      }
    }
  }catch(e){ console.warn('Question bank load failed, using built-in default:', e.message); }
}

function init(){
  state.phase = 'loading'; render();
  if(!window._fb?.db){
    window.addEventListener('fb-ready', init, { once:true });
    return;
  }
  loadQuestionBank().then(()=> loadEntityOptions()).then(()=> initSessionLookup());
}

function initSessionLookup(){
  window._fb.get(window._fb.ref(window._fb.db, 'smi_workshop_sessions')).then(snap=>{
    if(!snap.exists()){ state.phase='noSession'; render(); return; }
    const sessions = snap.val();
    const activeId = Object.keys(sessions).find(id => sessions[id].status==='active');
    if(!activeId){ state.phase='noSession'; render(); return; }
    state.sessionId = activeId;
    state.session = sessions[activeId];
    state.phase = 'identify';
    render();
  }).catch(err=>{
    console.error(err);
    state.phase='noSession'; render();
  });
}
init();
</script>
</body>
